<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта транспорта Новосибирска</title>
    
    <!-- Подключаем локальные файлы Leaflet -->
    <link rel="stylesheet" href="leaflet.css" />
    <script src="leaflet.js"></script>
    <script src="leaflet.marker.slideto.js"></script>
    <script src="script.js" defer></script>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #map {
            width: 100%;
            height: 100%;
            background-color: #f0f0f0;
        }
        
        /* Панель управления поверх карты */
        .controls-container {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .map-title {
            background: white;
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        /* Панель фильтров */
        .filter-panel {
            background: white;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            display: flex;
            gap: 8px;
        }

        /* Стильные интерактивные кнопки-переключатели */
        .filter-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            background: #f5f5f5;
            border: 1px solid #ddd;
            user-select: none;
            transition: all 0.2s ease;
        }

        /* Скрываем стандартный квадратный чекбокс */
        .filter-btn input {
            display: none;
        }

        /* Состояния при выборе (активные кнопки) */
        .filter-btn:has(input[value="Автобус"]:checked) { background: #2ecc71; color: white; border-color: #27ae60; }
        .filter-btn:has(input[value="Троллейбус"]:checked) { background: #3498db; color: white; border-color: #2980b9; }
        .filter-btn:has(input[value="Трамвай"]:checked) { background: #e74c3c; color: white; border-color: #c0392b; }
        .filter-btn:has(input[value="Маршрутка"]:checked) { background: #f1c40f; color: white; border-color: #f39c12; }

        /* Эффект наведения */
        .filter-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Стили маркеров транспорта */
        .transport-marker {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            transition: transform 0.2s ease;
        }
        .transport-marker:hover { transform: scale(1.15); z-index: 9999; }
        .bus-bg { background-color: #2ecc71; }
        .trolley-bg { background-color: #3498db; }
        .tram-bg { background-color: #e74c3c; }
        .minibus-bg { background-color: #f1c40f; }
        .transport-marker .emoji { font-size: 14px; line-height: 14px; }
        .transport-marker .route-num { font-size: 10px; font-weight: bold; color: white; text-shadow: 1px 1px 1px rgba(0,0,0,0.8); line-height: 10px; margin-top: 1px; }
    </style>
</head>
<body>

    <div class="controls-container">
        <!-- Заголовок -->
        <div class="map-title">
            <h3 style="margin: 0; font-size: 16px;">🚌 Мониторинг транспорта НСК</h3>
        </div>

        <!-- Интерактивные фильтры -->
        <div class="filter-panel" id="filterPanel">
            <label class="filter-btn">
                <input type="checkbox" value="Автобус" checked> 🚌 Автобусы
            </label>
            <label class="filter-btn">
                <input type="checkbox" value="Троллейбус" checked> 🚎 Троллейбусы
            </label>
            <label class="filter-btn">
                <input type="checkbox" value="Трамвай" checked> 🚋 Трамваи
            </label>
            <label class="filter-btn">
                <input type="checkbox" value="Маршрутка" checked> 🚐 Маршрутки
            </label>
        </div>
    </div>

    <div id="map"></div>

</body>
</html>
